name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      target_tag:
        description: Release tag
        required: true
        default: v0.x.x
      run_linux:
        description: Build for Linux?
        type: boolean
        default: true
      run_mac:
        description: Build for macOS?
        type: boolean
        default: true
      run_win:
        description: Build for Windows?
        type: boolean
        default: true
      run_android:
        description: 'Build for Android?'
        type: boolean
        default: true

jobs:
  release:
    name: ${{ matrix.target }}
    permissions:
      contents: write
    strategy:
      # Every target stands on its own: a broken Windows build must not take
      # the APK or the AppImage down with it.
      fail-fast: false
      matrix:
        include:
          - target: mac
            os: macos-latest
          - target: linux
            os: ubuntu-latest
          - target: win
            os: windows-2022
          - target: android
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    env:
      # A signed release build is only possible when the keystore secret exists,
      # otherwise the job falls back to a debug APK, which is still installable.
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - name: Check execution logic
        id: check
        shell: bash
        run: |
          SHOULD_RUN="false"

          if [[ "${{ github.event_name }}" == "push" ]]; then
            SHOULD_RUN="true"
          else
            if [[ "${{ matrix.target }}" == "mac" && "${{ inputs.run_mac }}" == "true" ]]; then SHOULD_RUN="true"; fi
            if [[ "${{ matrix.target }}" == "linux" && "${{ inputs.run_linux }}" == "true" ]]; then SHOULD_RUN="true"; fi
            if [[ "${{ matrix.target }}" == "win" && "${{ inputs.run_win }}" == "true" ]]; then SHOULD_RUN="true"; fi
            if [[ "${{ matrix.target }}" == "android" && "${{ inputs.run_android }}" == "true" ]]; then SHOULD_RUN="true"; fi
          fi

          echo "SHOULD_RUN=$SHOULD_RUN" >> $GITHUB_ENV
          echo "Decision for ${{ matrix.target }}: $SHOULD_RUN"

      - name: Checkout repository
        if: env.SHOULD_RUN == 'true'
        uses: actions/checkout@v4

      - name: Set Release Tag (Manual Workflow Dispatch)
        if: env.SHOULD_RUN == 'true' && github.event_name == 'workflow_dispatch'
        shell: bash
        run: echo "GITHUB_REF=refs/tags/${{ inputs.target_tag }}" >> $GITHUB_ENV

      - name: Install pnpm
        if: env.SHOULD_RUN == 'true'
        uses: pnpm/action-setup@v3
        with:
          version: 11.9.0

      - name: Setup Node.js and cache
        if: env.SHOULD_RUN == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"

      - name: Setup Java
        if: env.SHOULD_RUN == 'true' && matrix.target == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        if: env.SHOULD_RUN == 'true' && matrix.target == 'android'
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        if: env.SHOULD_RUN == 'true'
        run: pnpm install --frozen-lockfile

      - name: Build Main/Renderer
        if: env.SHOULD_RUN == 'true' && matrix.target != 'android'
        env:
          MAIN_VITE_DISCORD_CLIENT_ID: ${{ secrets.MAIN_VITE_DISCORD_CLIENT_ID }}
        run: pnpm electron:build

      - name: Build and Release (macOS)
        if: env.SHOULD_RUN == 'true' && matrix.target == 'mac'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm ci:build:mac

      - name: Build and Release (Windows)
        if: env.SHOULD_RUN == 'true' && matrix.target == 'win'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm ci:build:win

      - name: Install Linux dependencies
        if: env.SHOULD_RUN == 'true' && matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2

      - name: Build and Release (Linux)
        if: env.SHOULD_RUN == 'true' && matrix.target == 'linux'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm ci:build:linux

      - name: Build web assets
        if: env.SHOULD_RUN == 'true' && matrix.target == 'android'
        run: pnpm build

      - name: Sync Capacitor project
        if: env.SHOULD_RUN == 'true' && matrix.target == 'android'
        run: pnpm exec cap sync android

      - name: Read app version
        if: env.SHOULD_RUN == 'true' && matrix.target == 'android'
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Decode keystore
        if: env.SHOULD_RUN == 'true' && matrix.target == 'android' && env.HAS_KEYSTORE == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          KEYSTORE="$RUNNER_TEMP/release.keystore"

          # The secret picks up line breaks on its way through the browser, and
          # a single CR is enough for base64 to reject the whole input.
          printf '%s' "$ANDROID_KEYSTORE_BASE64" \
            | tr -d '[:space:]' \
            | base64 -d > "$KEYSTORE"

          if ! keytool -list -keystore "$KEYSTORE" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" > /dev/null; then
            echo "::error::The keystore could not be read. Check that" \
              "ANDROID_KEYSTORE_BASE64 holds the base64 of the keystore file" \
              "and that ANDROID_KEYSTORE_PASSWORD matches it."
            exit 1
          fi

          echo "ANDROID_KEYSTORE_PATH=$KEYSTORE" >> $GITHUB_ENV

      - name: Build release APK
        if: env.SHOULD_RUN == 'true' && matrix.target == 'android' && env.HAS_KEYSTORE == 'true'
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Build debug APK
        if: env.SHOULD_RUN == 'true' && matrix.target == 'android' && env.HAS_KEYSTORE != 'true'
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - name: Collect APK
        if: env.SHOULD_RUN == 'true' && matrix.target == 'android'
        id: apk
        run: |
          if [[ "$HAS_KEYSTORE" == "true" ]]; then
            SOURCE="android/app/build/outputs/apk/release/app-release.apk"
            SUFFIX=""
          else
            SOURCE="android/app/build/outputs/apk/debug/app-debug.apk"
            SUFFIX="-debug"
          fi

          NAME="radioPABM-${{ steps.version.outputs.version }}${SUFFIX}.apk"
          mv "$SOURCE" "$NAME"
          echo "name=$NAME" >> $GITHUB_OUTPUT

      - name: Upload APK artifact
        if: env.SHOULD_RUN == 'true' && matrix.target == 'android'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ${{ steps.apk.outputs.name }}
          if-no-files-found: error

      - name: Attach APK to the release
        if: env.SHOULD_RUN == 'true' && matrix.target == 'android'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.target_tag || github.ref_name }}
          files: ${{ steps.apk.outputs.name }}
          # The desktop targets publish through electron-builder, which only
          # ever fills a draft and leaves publishing to a human. Without this
          # the action finalizes the release once the APK is up, and every
          # desktop build that finishes later is refused with "existing type
          # not compatible with publishing type".
          draft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
