name: Release Android

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      target_tag:
        description: 'Release tag to attach the APK to (leave empty to only keep the artifact)'
        required: false
        default: ''

jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # A signed release build is only possible when the keystore secret exists,
      # otherwise the job falls back to a debug APK, which is still installable.
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9.15.2

      - name: Setup Node.js and cache
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web assets
        run: pnpm build

      - name: Sync Capacitor project
        run: pnpm exec cap sync android

      - name: Read app version
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Decode keystore
        if: env.HAS_KEYSTORE == 'true'
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> $GITHUB_ENV

      - name: Build release APK
        if: env.HAS_KEYSTORE == 'true'
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Build debug APK
        if: env.HAS_KEYSTORE != 'true'
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - name: Collect APK
        id: apk
        run: |
          if [[ "$HAS_KEYSTORE" == "true" ]]; then
            SOURCE="android/app/build/outputs/apk/release/app-release.apk"
            SUFFIX=""
          else
            SOURCE="android/app/build/outputs/apk/debug/app-debug.apk"
            SUFFIX="-debug"
          fi

          NAME="radioPABM-${{ steps.version.outputs.version }}${SUFFIX}.apk"
          mv "$SOURCE" "$NAME"
          echo "name=$NAME" >> $GITHUB_OUTPUT

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ${{ steps.apk.outputs.name }}
          if-no-files-found: error

      - name: Attach APK to the release
        if: github.event_name == 'push' || inputs.target_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.target_tag || github.ref_name }}
          files: ${{ steps.apk.outputs.name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
